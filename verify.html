<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Check a code – Work2Share team</title>
<style>
:root{--bg:#f4f7f6;--card:#fff;--ink:#12201d;--mute:#5d6d69;--line:#d5dedb;--ok:#0a7466;--bad:#c93a3a;--warn:#b27a00}
@media (prefers-color-scheme:dark){:root{--bg:#0b1210;--card:#131d1a;--ink:#e8f1ee;--mute:#92a5a0;--line:#26352f;--ok:#37c5ae;--bad:#ff7a7a;--warn:#f0c04a}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:var(--bg);color:var(--ink);font:500 16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{width:100%;max-width:460px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px}
h1{font-size:1.3rem;margin:0 0 4px}p.s{margin:0 0 18px;color:var(--mute);font-size:.9rem}
label{display:block;font-weight:700;font-size:.85rem;margin:14px 0 6px}label span{font-weight:500;color:var(--mute)}
input{width:100%;font:600 1rem ui-monospace,Menlo,Consolas,monospace;letter-spacing:.06em;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
input:focus{outline:2px solid var(--ok);border-color:transparent}
button{margin-top:18px;width:100%;font:700 1rem system-ui,sans-serif;padding:13px;border:0;border-radius:12px;background:var(--ok);color:#fff;cursor:pointer}
#out{margin-top:20px;border-radius:14px;padding:16px 18px;display:none;font-size:.95rem}
#out.ok{display:block;background:color-mix(in srgb,var(--ok) 14%,transparent);border:1.5px solid var(--ok)}
#out.bad{display:block;background:color-mix(in srgb,var(--bad) 14%,transparent);border:1.5px solid var(--bad)}
#out b.t{display:block;font-size:1.15rem;margin-bottom:6px}#out.ok b.t{color:var(--ok)}#out.bad b.t{color:var(--bad)}
#out ul{margin:8px 0 0;padding-left:18px}#out li{margin:3px 0}.w{color:var(--warn);font-weight:700}
small{display:block;margin-top:16px;color:var(--mute);font-size:.78rem}
</style>
</head>
<body>
<main>
<h1>Check a Work2Share code</h1>
<p class="s">For the team only. Paste the code the customer sent on WhatsApp.</p>
<form id="f" novalidate>
<label for="c">Code</label>
<input id="c" placeholder="W2S-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" spellcheck="false" required>
<label for="m">Number the WhatsApp message came from <span>(optional)</span></label>
<input id="m" type="tel" inputmode="numeric" placeholder="10-digit number" autocomplete="off">
<button type="submit">Check code</button>
</form>
<div id="out" role="status"></div>
<small>A genuine code is made by the Work2Share website from one mobile number. A code that was typed or invented by hand fails this check.</small>
</main>
<script src="js/w2scode.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id),out=$('out');
const clean=v=>String(v||'').replace(/\D/g,'').replace(/^(91|0)(?=\d{10}$)/,'');
$('f').addEventListener('submit',function(e){
 e.preventDefault();
 const raw=$('c').value.trim(),r=W2SCode.read(raw),from=clean($('m').value);
 if(!raw){out.className='';return}
 if(!r.ok){out.className='bad';out.innerHTML='<b class="t">❌ FAKE or mistyped code</b>This code was not made by the Work2Share website. Do not give any discount. If it looks like a typo, ask the customer to copy and paste it again.';return}
 const kind=r.type==='R'?'Referral code (7% off, Desk Rush)':'Desk Match winner code (5% off)';
 const li=['Type: '+kind,'Made for mobile number: <b>'+r.mobile+'</b>'];
 if(from){
  if(r.type==='M')li.push(from===r.mobile?'✅ Message is from the same number as the code':'<span class="w">⚠️ The message is from '+from+' but the code belongs to '+r.mobile+'. Do not apply it.</span>');
  else li.push(from===r.mobile?'<span class="w">⚠️ The message is from the code owner’s own number. A referral must come from the friend, not the referrer.</span>':'✅ The friend is a different number from the code owner');
 }else li.push(r.type==='M'?'Check that the WhatsApp number matches the number above.':'Credit the referrer at the number above once the friend books. The friend must be a different number.');
 out.className='ok';out.innerHTML='<b class="t">✅ GENUINE code</b><ul>'+li.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
});
})();
</script>
</body>
</html>
